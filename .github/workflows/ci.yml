name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check lib/client.js && node --check lib/index.js
      - name: Offline render check
        run: node test/render-check.mjs
      - name: i18n check
        run: node test/i18n-check.mjs
      - name: Dictionary key check
        run: node test/keys-check.mjs
